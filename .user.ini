; Wave Photography - server upload limits.
; Shared hosting defaults (often 2M-8M post_max_size and 20 max_file_uploads) are far
; too small for multi-photo batches: PHP silently discards the whole request once
; post_max_size is exceeded, which is why bulk uploads failed with no useful error.
; Keep post_max_size comfortably above upload_max_filesize * max_file_uploads.
upload_max_filesize = 64M
post_max_size = 320M
max_file_uploads = 100
max_execution_time = 300
max_input_time = 300
memory_limit = 512M
